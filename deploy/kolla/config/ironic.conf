# Merged into ironic.conf by Kolla from /etc/kolla/config/ironic.conf.
[DEFAULT]
# In-band inspection by IPA, which runs the collector below.
enabled_inspect_interfaces = agent,redfish,no-inspect
default_inspect_interface = agent
[conductor]
# The clean step clears the TPM after an instance is deleted; Kolla-Ansible turns this off.
automated_clean = true
[inspector]
# The openstack_tpm collector reports the TPM's EK, which the issuer reads from the inspection data.
extra_kernel_params = ipa-inspection-collectors=default,openstack_tpm
