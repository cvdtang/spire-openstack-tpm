- name: Required variables
  ansible.builtin.assert:
    that:
      - spire_agent_server_address | length > 0
      - spire_agent_trust_domain | length > 0
      - spire_agent_bundle | length > 0
      - spire_agent_files | length > 0

- name: The plugin's checksum, which the agent verifies before it runs the plugin
  ansible.builtin.set_fact:
    spire_agent_plugin_checksum: >-
      {{ lookup('ansible.builtin.pipe', 'sha256sum ' ~ (spire_agent_files ~ '/openstack-tpm-spire-agent' ~ ('.exe' if ansible_os_family == 'Windows' else '')) | quote).split()[0] }}

- name: Install on Windows
  ansible.builtin.include_tasks: windows.yml
  when: ansible_os_family == 'Windows'

- name: Install on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_os_family != 'Windows'
