# Tenant SPIRE Server for one project, reading Nova and Keystone with an application credential for extra selectors.
# Run with -expandEnv and BIND_PORT, TRUST_DOMAIN, LOG_LEVEL, PLUGIN_SUM, PROJECT_ID, KEYSTONE_URL and APPCRED_ID in the environment.
server {
    bind_address = "0.0.0.0"
    bind_port = "${BIND_PORT}"
    socket_path = "/run/spire-server/api.sock"
    trust_domain = "${TRUST_DOMAIN}"
    data_dir = "/var/lib/spire/server"
    log_level = "${LOG_LEVEL}"
    agent_ttl = "1h"
    default_x509_svid_ttl = "1h"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data { keys_path = "/var/lib/spire/server/keys.json" }
    }
    NodeAttestor "openstack_tpm" {
        plugin_cmd = "/opt/openstack-tpm/openstack-tpm-spire-server"
        plugin_checksum = "${PLUGIN_SUM}"
        plugin_data {
            ca_bundle = "/etc/spire/openstack-tpm/ca.pem"
            projects = ["${PROJECT_ID}"]
            nova_selectors = true
            keystone_selectors = true
            openstack {
                auth_url = "${KEYSTONE_URL}"
                credentials = [
                    {
                        application_credential_id = "${APPCRED_ID}"
                        application_credential_secret_file = "/etc/spire/openstack-tpm/os-appcred"
                    },
                ]
            }
        }
    }
}
