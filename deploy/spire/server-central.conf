# Central SPIRE Server for every project of a Keystone domain, using only the certificate's selectors and no OpenStack credential.
# Run with -expandEnv and BIND_PORT, TRUST_DOMAIN, LOG_LEVEL, PLUGIN_SUM and DOMAIN_ID in the environment.
server {
    bind_address = "0.0.0.0"
    bind_port = "${BIND_PORT}"
    socket_path = "/run/spire-server/api.sock"
    trust_domain = "${TRUST_DOMAIN}"
    data_dir = "/var/lib/spire/server"
    log_level = "${LOG_LEVEL}"
    agent_ttl = "1h"
    default_x509_svid_ttl = "1h"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data { keys_path = "/var/lib/spire/server/keys.json" }
    }
    NodeAttestor "openstack_tpm" {
        plugin_cmd = "/opt/openstack-tpm/openstack-tpm-spire-server"
        plugin_checksum = "${PLUGIN_SUM}"
        plugin_data {
            ca_bundle = "/etc/spire/openstack-tpm/ca.pem"
            domains = ["${DOMAIN_ID}"]
        }
    }
}
